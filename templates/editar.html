<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="container">
        <h1>Editar Usuario</h1>

        <form action="{{ url_for('editar_usuario', id=usuario[0]) }}" method="POST">
            <input type="text" name="nombre" value="{{ usuario[1] }}" required>
            <input type="email" name="correo" value="{{ usuario[2] }}" required>
            <input type="tel" name="telefono" value="{{ usuario[3] }}" required>
            <input type="submit" value="Actualizar">
        </form>

        <br>
        <a href="{{ url_for('listar_usuarios') }}" class="btn btn-editar">Volver a la Lista</a>
    </div>

    <footer>
        <p>CRUD Flask - Editar Usuario</p>
    </footer>
</body>
</html>
